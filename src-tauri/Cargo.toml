[package]
name = "local-whisper"
version = "0.2.1"
description = "Local Whisper — voz a texto privado en tu Mac, con Whisper local."
authors = ["Pol"]
edition = "2021"

[lib]
name = "local_whisper_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["macos-private-api"] }
tauri-plugin-global-shortcut = "2"
tauri-plugin-sql = { version = "2", features = ["sqlite"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = [
    "rustls-tls",
    "stream",
    "json",
] }
futures-util = "0.3"
tokio = { version = "1", features = ["fs", "io-util", "sync", "time"] }
uuid = { version = "1", features = ["v4"] }
chrono = { version = "0.4", features = ["serde"] }
sysinfo = { version = "0.33", default-features = false, features = ["system"] }
tauri-plugin-updater = "2.10.1"
url = "2.5.8"

# whisper.cpp bindings — split per platform because the `metal` feature drags
# in macOS-only frameworks (Foundation) that don't exist on Linux/Windows.
# Linux & Windows fall back to CPU for now; we'll add CUDA/Vulkan in a future
# revision when there's user demand.

[target.'cfg(target_os = "macos")'.dependencies]
cocoa = "0.26"
objc = "0.2"
# 0.16 bundles a much newer whisper.cpp; 0.13's Metal shaders no longer compile
# on current macOS Metal toolchains (ggml_backend_metal_init fails → silent CPU
# fallback → very slow). See lib.rs transcribe_audio.
whisper-rs = { version = "0.16", features = ["metal"] }

[target.'cfg(not(target_os = "macos"))'.dependencies]
whisper-rs = "0.16"
