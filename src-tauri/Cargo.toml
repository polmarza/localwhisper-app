[package]
name = "local-whisper"
version = "0.1.0"
description = "Local Whisper — voz a texto privado en tu Mac, con Whisper local."
authors = ["Pol"]
edition = "2021"

[lib]
name = "local_whisper_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["macos-private-api"] }
tauri-plugin-global-shortcut = "2"
tauri-plugin-sql = { version = "2", features = ["sqlite"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = [
    "rustls-tls",
    "stream",
    "json",
] }
futures-util = "0.3"
tokio = { version = "1", features = ["fs", "io-util", "sync", "time"] }
uuid = { version = "1", features = ["v4"] }
chrono = { version = "0.4", features = ["serde"] }
# whisper.cpp bindings — Metal-accelerated on Apple Silicon. The first cargo
# build compiles whisper.cpp (~1-2 min); subsequent builds reuse the cache.
whisper-rs = { version = "0.13", features = ["metal"] }

[target.'cfg(target_os = "macos")'.dependencies]
cocoa = "0.26"
objc = "0.2"
