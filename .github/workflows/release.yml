name: Build & Release

# Triggers a build on every tag push. Tag conventions:
#   v1.2.3              → stable release
#   v1.2.3-preview.1    → preview release
on:
  push:
    tags:
      - "v*"

permissions:
  contents: write  # needed to publish a GitHub Release

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          # Apple Silicon (M-series)
          - platform: macos-latest
            target: aarch64-apple-darwin
            args: "--target aarch64-apple-darwin"
          # Intel Mac
          - platform: macos-latest
            target: x86_64-apple-darwin
            args: "--target x86_64-apple-darwin"
          # Windows 64-bit
          - platform: windows-latest
            target: x86_64-pc-windows-msvc
            args: ""
          # Linux 64-bit (Ubuntu, AppImage / .deb)
          - platform: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            args: ""

    runs-on: ${{ matrix.platform }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 9

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      # Linux-only system deps for Tauri / WebKitGTK
      - name: Install Linux deps
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            libssl-dev

      - name: Install frontend deps
        run: pnpm install --frozen-lockfile

      # tauri-action signs the macOS bundle with the Developer ID identity and
      # notarizes it when the APPLE_* secrets are present, embedding the
      # entitlements from bundle.macOS.entitlements. No manual re-sign needed.
      - name: Build & release
        id: tauri
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Apple Developer ID signing + notarization.
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          # Tauri auto-updater signing — separate future step, not wired yet:
          # TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          # TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "Local Whisper ${{ github.ref_name }}"
          releaseBody: |
            ## Local Whisper ${{ github.ref_name }}

            Descarga el instalador para tu sistema operativo más abajo.

            - **macOS:** `.dmg` (Apple Silicon: `aarch64`, Intel: `x64`)
            - **Windows:** `.exe`
            - **Linux:** `.AppImage` o `.deb`

            Si es la primera vez que abres Local Whisper en macOS o Windows, tu
            sistema mostrará un aviso de seguridad — consulta las instrucciones
            en https://localwhisper.app para abrirla.
          releaseDraft: false
          # Mark previews as "prerelease" on GitHub so they don't appear as
          # "latest" to anyone browsing the releases page.
          prerelease: ${{ contains(github.ref_name, '-preview') || contains(github.ref_name, '-beta') }}
          args: ${{ matrix.args }}

  # ----------------------------------------------------------------------
  # Mirror the GitHub Release artifacts to Cloudflare R2 so the landing
  # page can serve fast, branded download URLs (downloads.localwhisper.app)
  # instead of relying on GitHub's CDN. We always upload to a versioned
  # folder (/vX.Y.Z/); stable releases also overwrite /latest/ with stable,
  # unversioned filenames so the landing's download buttons never go stale.
  # ----------------------------------------------------------------------
  upload-to-r2:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download release assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p release-assets
          gh release download "${{ github.ref_name }}" \
            --dir release-assets \
            -R ${{ github.repository }}
          ls -la release-assets/

      - name: Upload versioned folder to R2
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          R2_ENDPOINT: https://${{ secrets.R2_ACCOUNT_ID }}.r2.cloudflarestorage.com
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          TAG: ${{ github.ref_name }}
        run: |
          aws s3 cp release-assets/ \
            "s3://${R2_BUCKET}/${TAG}/" \
            --recursive \
            --endpoint-url "$R2_ENDPOINT"

      # Stable channel mirror: only run for tags WITHOUT -preview/-beta suffix.
      # We rename to stable filenames so links like
      # releases.localwhisper.app/latest/Local-Whisper-arm64.dmg never change.
      - name: Update /latest/ with stable filenames (stable releases only)
        if: ${{ !contains(github.ref_name, '-preview') && !contains(github.ref_name, '-beta') }}
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          R2_ENDPOINT: https://${{ secrets.R2_ACCOUNT_ID }}.r2.cloudflarestorage.com
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
        run: |
          mkdir latest
          # macOS
          cp release-assets/*aarch64.dmg     latest/Local-Whisper-arm64.dmg     2>/dev/null || true
          cp release-assets/*x64.dmg         latest/Local-Whisper-intel.dmg     2>/dev/null || true
          cp release-assets/*aarch64.app.tar.gz latest/Local-Whisper-arm64.app.tar.gz 2>/dev/null || true
          cp release-assets/*x64.app.tar.gz  latest/Local-Whisper-intel.app.tar.gz  2>/dev/null || true
          # Windows
          cp release-assets/*x64-setup.exe   latest/Local-Whisper-Setup.exe     2>/dev/null || true
          cp release-assets/*x64_en-US.msi   latest/Local-Whisper.msi           2>/dev/null || true
          # Linux
          cp release-assets/*amd64.AppImage  latest/Local-Whisper.AppImage      2>/dev/null || true
          cp release-assets/*amd64.deb       latest/Local-Whisper.deb           2>/dev/null || true
          cp release-assets/*x86_64.rpm      latest/Local-Whisper.rpm           2>/dev/null || true

          ls -la latest/
          aws s3 sync latest/ \
            "s3://${R2_BUCKET}/latest/" \
            --delete \
            --endpoint-url "$R2_ENDPOINT"
