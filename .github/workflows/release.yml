name: Build & Release

# Triggers a build on every tag push. Tag conventions:
#   v1.2.3              → stable release
#   v1.2.3-preview.1    → preview release
on:
  push:
    tags:
      - "v*"

permissions:
  contents: write  # needed to publish a GitHub Release

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          # Apple Silicon (M-series)
          - platform: macos-latest
            target: aarch64-apple-darwin
            args: "--target aarch64-apple-darwin"
          # Intel Mac
          - platform: macos-latest
            target: x86_64-apple-darwin
            args: "--target x86_64-apple-darwin"
          # Windows 64-bit
          - platform: windows-latest
            target: x86_64-pc-windows-msvc
            args: ""
          # Linux 64-bit (Ubuntu, AppImage / .deb)
          - platform: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            args: ""

    runs-on: ${{ matrix.platform }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 9

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      # Linux-only system deps for Tauri / WebKitGTK
      - name: Install Linux deps
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            libssl-dev

      - name: Install frontend deps
        run: pnpm install --frozen-lockfile

      # tauri-action signs the .app ad-hoc but does NOT embed the entitlements
      # from `bundle.macOS.entitlements` when there's no Developer ID. The
      # post-build step below re-signs with the entitlements file so the WebView
      # can actually access the microphone (without these, the recorder pill
      # flashes for a frame and dies because the macOS sandbox blocks
      # getUserMedia silently).
      #
      # Once Apple Developer enrollment is approved and the APPLE_* secrets are
      # set, the proper signing identity replaces ad-hoc and this becomes
      # unnecessary — tauri-action handles signing+entitlements together when a
      # real identity is configured.
      - name: Build & release
        id: tauri
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # NOTE: The signing env vars are intentionally NOT passed yet. The
          # Tauri action treats them as "signing requested" even when empty,
          # which makes the macOS bundling step fail trying to import an empty
          # cert into the keychain. Uncomment and add the GitHub Secrets once:
          #   1. Apple Developer enrollment is approved → APPLE_* secrets
          #   2. Tauri updater key pair is generated   → TAURI_SIGNING_* secrets
          #
          # APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          # APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          # APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          # APPLE_ID: ${{ secrets.APPLE_ID }}
          # APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          # APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          # TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          # TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "Local Whisper ${{ github.ref_name }}"
          releaseBody: |
            ## Local Whisper ${{ github.ref_name }}

            Descarga el instalador para tu sistema operativo más abajo.

            - **macOS:** `.dmg` (Apple Silicon: `aarch64`, Intel: `x64`)
            - **Windows:** `.exe`
            - **Linux:** `.AppImage` o `.deb`

            Si es la primera vez que abres Local Whisper en macOS o Windows, tu
            sistema mostrará un aviso de seguridad — consulta las instrucciones
            en https://localwhisper.app para abrirla.
          releaseDraft: false
          # Mark previews as "prerelease" on GitHub so they don't appear as
          # "latest" to anyone browsing the releases page.
          prerelease: ${{ contains(github.ref_name, '-preview') || contains(github.ref_name, '-beta') }}
          args: ${{ matrix.args }}

      # macOS only: re-sign the .app with entitlements and rebuild the DMG so
      # the published artifact actually has the audio-input entitlement
      # embedded. See the "Build & release" step above for the why.
      - name: Re-sign with entitlements (macOS only)
        if: startsWith(matrix.platform, 'macos')
        env:
          TARGET: ${{ matrix.target }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -eu
          APP="src-tauri/target/${TARGET}/release/bundle/macos/Local Whisper.app"
          DMG_DIR="src-tauri/target/${TARGET}/release/bundle/dmg"
          ENT="src-tauri/entitlements.plist"

          echo "Re-signing $APP with entitlements"
          codesign --force --deep --sign - --entitlements "$ENT" "$APP"

          echo "Re-bundling DMG so it ships the resigned .app"
          # The original DMG produced by tauri-action embeds the pre-sign app.
          # We rebuild it via Tauri's bundler so the DMG matches the new sig.
          rm -f "$DMG_DIR"/*.dmg
          pnpm tauri build --target "$TARGET" --bundles dmg --no-bundle 2>&1 || true
          # Some Tauri versions don't expose --no-bundle the same way; fall back
          # to a fresh DMG build if the above didn't produce one.
          if [ -z "$(ls "$DMG_DIR"/*.dmg 2>/dev/null)" ]; then
            pnpm tauri build --target "$TARGET" --bundles dmg
          fi

          echo "Re-uploading resigned artifacts to the GitHub Release"
          gh release upload "${{ github.ref_name }}" \
            "$DMG_DIR"/*.dmg \
            --clobber \
            -R ${{ github.repository }}

          # Also re-upload the .app.tar.gz (used by the auto-updater later).
          APP_TARGZ_DIR="src-tauri/target/${TARGET}/release/bundle/macos"
          if [ -d "$APP_TARGZ_DIR" ]; then
            # Re-create the tarball from the resigned .app.
            TAR_NAME=$(basename "$APP" .app)
            (cd "$APP_TARGZ_DIR" && tar czf "${TAR_NAME}.app.tar.gz" "${TAR_NAME}.app")
            gh release upload "${{ github.ref_name }}" \
              "$APP_TARGZ_DIR/${TAR_NAME}.app.tar.gz" \
              --clobber \
              -R ${{ github.repository }} || true
          fi

  # ----------------------------------------------------------------------
  # Mirror the GitHub Release artifacts to Cloudflare R2 so the landing
  # page can serve fast, branded download URLs (downloads.localwhisper.app)
  # instead of relying on GitHub's CDN. We always upload to a versioned
  # folder (/vX.Y.Z/); stable releases also overwrite /latest/ with stable,
  # unversioned filenames so the landing's download buttons never go stale.
  # ----------------------------------------------------------------------
  upload-to-r2:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download release assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p release-assets
          gh release download "${{ github.ref_name }}" \
            --dir release-assets \
            -R ${{ github.repository }}
          ls -la release-assets/

      - name: Upload versioned folder to R2
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          R2_ENDPOINT: https://${{ secrets.R2_ACCOUNT_ID }}.r2.cloudflarestorage.com
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          TAG: ${{ github.ref_name }}
        run: |
          aws s3 cp release-assets/ \
            "s3://${R2_BUCKET}/${TAG}/" \
            --recursive \
            --endpoint-url "$R2_ENDPOINT"

      # Stable channel mirror: only run for tags WITHOUT -preview/-beta suffix.
      # We rename to stable filenames so links like
      # releases.localwhisper.app/latest/Local-Whisper-arm64.dmg never change.
      - name: Update /latest/ with stable filenames (stable releases only)
        if: ${{ !contains(github.ref_name, '-preview') && !contains(github.ref_name, '-beta') }}
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          R2_ENDPOINT: https://${{ secrets.R2_ACCOUNT_ID }}.r2.cloudflarestorage.com
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
        run: |
          mkdir latest
          # macOS
          cp release-assets/*aarch64.dmg     latest/Local-Whisper-arm64.dmg     2>/dev/null || true
          cp release-assets/*x64.dmg         latest/Local-Whisper-intel.dmg     2>/dev/null || true
          cp release-assets/*aarch64.app.tar.gz latest/Local-Whisper-arm64.app.tar.gz 2>/dev/null || true
          cp release-assets/*x64.app.tar.gz  latest/Local-Whisper-intel.app.tar.gz  2>/dev/null || true
          # Windows
          cp release-assets/*x64-setup.exe   latest/Local-Whisper-Setup.exe     2>/dev/null || true
          cp release-assets/*x64_en-US.msi   latest/Local-Whisper.msi           2>/dev/null || true
          # Linux
          cp release-assets/*amd64.AppImage  latest/Local-Whisper.AppImage      2>/dev/null || true
          cp release-assets/*amd64.deb       latest/Local-Whisper.deb           2>/dev/null || true
          cp release-assets/*x86_64.rpm      latest/Local-Whisper.rpm           2>/dev/null || true

          ls -la latest/
          aws s3 sync latest/ \
            "s3://${R2_BUCKET}/latest/" \
            --delete \
            --endpoint-url "$R2_ENDPOINT"
