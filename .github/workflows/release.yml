name: Build & Release

# Triggers a build on every tag push. Tag conventions:
#   v1.2.3              → stable release
#   v1.2.3-preview.1    → preview release
on:
  push:
    tags:
      - "v*"

permissions:
  contents: write  # needed to publish a GitHub Release

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          # Apple Silicon (M-series)
          - platform: macos-latest
            target: aarch64-apple-darwin
            args: "--target aarch64-apple-darwin"
          # Intel Mac
          - platform: macos-latest
            target: x86_64-apple-darwin
            args: "--target x86_64-apple-darwin"
          # Windows 64-bit
          - platform: windows-latest
            target: x86_64-pc-windows-msvc
            args: ""
          # Linux 64-bit (Ubuntu, AppImage / .deb)
          - platform: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            args: ""

    runs-on: ${{ matrix.platform }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 9

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      # Linux-only system deps for Tauri / WebKitGTK
      - name: Install Linux deps
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            libssl-dev

      - name: Install frontend deps
        run: pnpm install --frozen-lockfile

      - name: Build & release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # NOTE: The signing env vars are intentionally NOT passed yet. The
          # Tauri action treats them as "signing requested" even when empty,
          # which makes the macOS bundling step fail trying to import an empty
          # cert into the keychain. Uncomment and add the GitHub Secrets once:
          #   1. Apple Developer enrollment is approved → APPLE_* secrets
          #   2. Tauri updater key pair is generated   → TAURI_SIGNING_* secrets
          #
          # APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          # APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          # APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          # APPLE_ID: ${{ secrets.APPLE_ID }}
          # APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          # APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          # TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          # TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "Local Whisper ${{ github.ref_name }}"
          releaseBody: |
            ## Local Whisper ${{ github.ref_name }}

            Descarga el instalador para tu sistema operativo más abajo.

            - **macOS:** `.dmg` (Apple Silicon: `aarch64`, Intel: `x64`)
            - **Windows:** `.exe`
            - **Linux:** `.AppImage` o `.deb`

            Si es la primera vez que abres Local Whisper en macOS o Windows, tu
            sistema mostrará un aviso de seguridad — consulta las instrucciones
            en https://localwhisper.app para abrirla.
          releaseDraft: false
          # Mark previews as "prerelease" on GitHub so they don't appear as
          # "latest" to anyone browsing the releases page.
          prerelease: ${{ contains(github.ref_name, '-preview') || contains(github.ref_name, '-beta') }}
          args: ${{ matrix.args }}
